<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Idiom 연습</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Lora:ital,wght@0,500;0,600;1,500&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f2ede3;
    --card: #fbf8f1;
    --ink: #35322c;
    --muted: #8a8272;
    --line: #ddd5c4;
    --accent: #a8402f;
    --accent-soft: #f4e3df;
    --good: #3d7a4e;
    --good-soft: #e6efe7;
    --bad: #a8402f;
    --bad-soft: #f6e5e1;
    --over: #a07417;
    --over-soft: #f3ecd9;
  }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
    font-size: 15px; line-height: 1.6;
    padding-bottom: 80px;
  }
  .sitenav {
    display: flex; gap: 4px; justify-content: center; align-items: center;
    background: var(--ink); padding: 8px 16px;
  }
  .sitenav a {
    color: rgba(255, 255, 255, .75); text-decoration: none;
    font-size: 13px; font-weight: 500; padding: 4px 14px; border-radius: 999px;
  }
  .sitenav a:hover { color: #fff; }
  .sitenav a.on { background: var(--accent); color: #fff; font-weight: 700; }
  header { text-align: center; padding: 44px 16px 8px; }
  .eyebrow {
    font-size: 12px; font-weight: 700; letter-spacing: 6px;
    color: var(--accent); text-transform: uppercase;
  }
  h1 {
    font-family: "Gowun Batang", serif; font-weight: 700;
    font-size: clamp(28px, 5vw, 42px); letter-spacing: 2px;
    margin-top: 10px; text-wrap: balance;
  }
  .lede { color: var(--muted); font-size: 14px; margin-top: 10px; }

  /* ── 탭들 ── */
  #lessonTabs { display: flex; justify-content: center; gap: 6px; margin-top: 34px; }
  #lessonTabs button {
    font-family: "Gowun Batang", serif; font-weight: 700; font-size: 15px;
    padding: 10px 22px 8px; cursor: pointer;
    border: 1px solid var(--line); border-bottom: none;
    border-radius: 10px 10px 0 0; background: #ece5d6; color: var(--muted);
  }
  #lessonTabs button.on { background: var(--card); color: var(--ink); transform: translateY(1px); }
  #partRow { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; padding: 18px 16px 0; }
  #partRow button {
    font-size: 13px; font-weight: 500; padding: 6px 16px; cursor: pointer;
    border: 1px solid var(--line); border-radius: 999px; background: var(--card); color: var(--muted);
  }
  #partRow button.on { background: var(--ink); border-color: var(--ink); color: var(--card); font-weight: 700; }
  #modeRow { display: flex; justify-content: center; margin-top: 12px; }
  #modeRow .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--card); }
  #modeRow button {
    font-size: 13px; font-weight: 500; padding: 7px 18px; cursor: pointer;
    border: none; background: transparent; color: var(--muted);
  }
  #modeRow button.on { background: var(--accent); color: #fff; font-weight: 700; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* ── 시험지 ── */
  #paper {
    max-width: 780px; margin: 0 auto; background: var(--card);
    border: 1px solid var(--line); border-radius: 4px;
    box-shadow: 0 2px 10px rgba(53, 50, 44, .07);
    padding: 26px 30px 40px;
  }
  @media (max-width: 820px) { #paper { margin: 0 12px; padding: 20px 16px 32px; } }

  #statusbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-bottom: 18px; }
  #statusMsg { font-size: 13px; color: var(--muted); }
  #statusMsg b.g { color: var(--good); }
  #statusMsg b.o { color: var(--over); }
  #statusMsg b.b { color: var(--bad); }
  #fillCount { margin-left: auto; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  #statusbar .btn {
    font-family: inherit; font-size: 13px; font-weight: 500; padding: 7px 14px;
    border: 1px solid var(--line); border-radius: 7px; background: var(--card); cursor: pointer; color: var(--ink);
  }
  #statusbar .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  #statusbar .btn.hinton { background: var(--over-soft); border-color: var(--over); color: var(--over); }

  .section { margin-top: 26px; }
  .sechead { display: flex; align-items: baseline; gap: 10px; border-bottom: 2px solid var(--ink); padding-bottom: 6px; }
  .sechead .range { font-family: "Lora", serif; font-style: italic; color: var(--accent); font-size: 14px; font-weight: 600; }
  .sechead .st { font-family: "Gowun Batang", serif; font-weight: 700; font-size: 17px; }
  .sechead .ss { font-size: 12px; color: var(--muted); }

  .item { padding: 16px 0 14px; border-bottom: 1px dashed var(--line); position: relative; }
  .item .top { display: flex; gap: 10px; align-items: baseline; }
  .item .no { font-family: "Lora", serif; font-size: 13px; color: var(--muted); min-width: 24px; font-variant-numeric: tabular-nums; }
  .sp {
    font-size: 11px; font-weight: 700; color: var(--accent);
    background: var(--accent-soft); border-radius: 4px; padding: 1px 7px;
    align-self: center; white-space: nowrap;
  }
  .ko { font-size: 15px; }
  .en-line { font-family: "Lora", Georgia, serif; font-size: 16.5px; line-height: 2.1; }
  .verdict { position: absolute; right: 0; top: 14px; font-size: 12px; font-weight: 700; }
  .verdict.g { color: var(--good); }
  .verdict.b { color: var(--bad); }
  .verdict.o { color: var(--over); }
  .item.correct { box-shadow: inset 3px 0 0 var(--good); padding-left: 10px; }
  .item.wrong { box-shadow: inset 3px 0 0 var(--bad); padding-left: 10px; }
  .item.override { box-shadow: inset 3px 0 0 var(--over); padding-left: 10px; }

  .writein {
    display: block; width: calc(100% - 34px); margin: 10px 0 0 34px;
    font-family: "Lora", Georgia, serif; font-size: 15.5px; color: var(--ink);
    background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 9px 12px;
  }
  .writein::placeholder { font-style: italic; color: #b6ad9a; }
  .blank {
    font-family: "Lora", Georgia, serif; font-size: 15px; color: var(--ink);
    background: #fff; border: none; border-bottom: 2px solid var(--accent);
    padding: 1px 4px; text-align: center;
  }
  .blank.hint::placeholder { color: var(--over); font-weight: 600; }
  .item .answer { margin: 8px 0 0 34px; font-size: 13.5px; color: var(--muted); }
  .item .answer b { font-family: "Lora", serif; color: var(--ink); font-weight: 500; }
  .overbtn {
    margin: 8px 0 0 34px; font-family: inherit; font-size: 12px; padding: 4px 10px;
    border: 1px solid var(--line); border-radius: 6px; background: var(--card); cursor: pointer; color: var(--ink);
  }
  .overbtn.on { background: var(--over); border-color: var(--over); color: #fff; }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 30px; }
  .q-text { font-size: 15px; }
  .q-en { font-family: "Lora", Georgia, serif; font-size: 16px; line-height: 1.9; }
  .given { margin: 6px 0 0 34px; font-family: "Lora", Georgia, serif; font-size: 15px; color: var(--ink); background: #f5f0e5; border-radius: 4px; padding: 6px 12px; }
  .opts { display: flex; flex-direction: column; gap: 6px; margin: 10px 0 0 34px; }
  .opt, .pk {
    font-family: "Lora", Georgia, serif; font-size: 15px; text-align: left; cursor: pointer;
    background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px; color: var(--ink);
  }
  .pk { display: inline-block; padding: 1px 10px; margin: 0 2px; border-radius: 999px; }
  .opt.sel, .pk.sel { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
  .exp { margin: 6px 0 0 34px; font-size: 13px; color: var(--muted); }
</style>
</head>

<header>
  <div class="eyebrow">Idioms · p.132–133 &amp; Worksheet</div>
  <h1>Idiom 연습</h1>
  <div class="lede">밑줄 친 idiom을 뜻이 드러나게 바꿔 문장 전체를 쓰세요. 13문항</div>
</header>
<div style="height:16px"></div>

<div id="paper">
  <div id="statusbar">
    <span id="statusMsg">아직 채점 전</span>
    <span id="fillCount"></span>
    <button class="btn" onclick="resetAll()">다시 풀기</button>
    <button class="btn primary" id="gradeBtn" onclick="gradeAll()">채점하기</button>
  </div>
  <div id="content"></div>
  <footer>① 다 풀고 채점하기 → 정답/오답만 표시 　② 틀린 문제 고친 뒤 다시 채점 　③ 문항별 "선생님 채점"으로 답·해설 확인, 애매한 답은 "정답 처리"<br>자동 채점은 모범 답안과 단어가 같을 때만 정답 — 뜻이 맞는 다른 표현은 "정답 처리"로 인정해 주세요.</footer>
</div>

<script>
// 문항 데이터 (엔진: practice.js). 섹션 t는 편집용 라벨, 화면엔 안 나옴
const SECTIONS = [
  { t: "Idioms", items: [
    { t: "write", q: "밑줄 친 idiom을 뜻이 드러나게 바꿔 문장 전체를 쓰세요.", given: "Her dance video <u>went viral</u> overnight.", a: ["Her dance video became very popular overnight.", "Her dance video became very famous overnight.", "Her dance video became very popular or famous overnight."], exp: "go viral = very popular or famous → 과거형 became." },
    { t: "write", q: "밑줄 친 idiom을 뜻이 드러나게 바꿔 문장 전체를 쓰세요.", given: "This new phone <u>costs an arm and a leg</u>.", a: ["This new phone is very expensive."], exp: "cost an arm and a leg = very expensive → 동사도 is로." },
    { t: "write", q: "밑줄 친 idiom을 뜻이 드러나게 바꿔 문장 전체를 쓰세요.", given: "I can't go to school today. I'm feeling <u>under the weather</u>.", a: ["I can't go to school today. I'm feeling sick.", "I cannot go to school today. I am feeling sick."], exp: "under the weather = sick." },
    { t: "write", q: "밑줄 친 idiom을 뜻이 드러나게 바꿔 문장 전체를 쓰세요.", given: "The math test was a <u>piece of cake</u>.", a: ["The math test was easy."], exp: "piece of cake = easy → 관사 a도 빼기." },
    { t: "write", q: "밑줄 친 idiom을 뜻이 드러나게 바꿔 문장 전체를 쓰세요.", given: "Minho <u>let the cat out of the bag</u> about the surprise party.", a: ["Minho told the secret about the surprise party.", "Minho told a secret about the surprise party."], exp: "let the cat out of the bag = tell a secret → 과거형 told." },
    { t: "write", q: "밑줄 친 idiom을 뜻이 드러나게 바꿔 문장 전체를 쓰세요.", given: "I have to <u>hit the books</u> tonight because I have a test tomorrow.", a: ["I have to study tonight because I have a test tomorrow.", "I have to study hard tonight because I have a test tomorrow."], exp: "hit the books = study / study hard." },
    { t: "write", q: "밑줄 친 idiom을 뜻이 드러나게 바꿔 문장 전체를 쓰세요.", given: "I always have <u>butterflies in my stomach</u> before a speech.", a: ["I always feel nervous before a speech.", "I am always nervous before a speech."], exp: "butterflies in my stomach = nervous → have까지 바꿔 feel[am] nervous." },
    { t: "write", q: "밑줄 친 idiom을 뜻이 드러나게 바꿔 문장 전체를 쓰세요.", given: "My dad eats fast food only <u>once in a blue moon</u>.", a: ["My dad eats fast food only rarely.", "My dad rarely eats fast food."], exp: "once in a blue moon = rarely." },
    { t: "write", q: "밑줄 친 idiom을 뜻이 드러나게 바꿔 문장 전체를 쓰세요.", given: "<u>Hold your horses!</u> The movie hasn't started yet.", a: ["Wait! The movie hasn't started yet.", "Wait! The movie has not started yet."], exp: "Hold your horses = wait." },
    { t: "write", q: "밑줄 친 idiom을 뜻이 드러나게 바꿔 문장 전체를 쓰세요.", given: "The two teams were <u>neck and neck</u> until the last minute.", a: ["The two teams were very close until the last minute."], exp: "neck and neck = very close." },
    { t: "write", q: "밑줄 친 idiom을 뜻이 드러나게 바꿔 문장 전체를 쓰세요.", given: "\"<u>Break a leg</u> at your piano contest!\"", a: ["Good luck at your piano contest!"], exp: "break a leg = good luck." },
    { t: "write", q: "밑줄 친 idiom을 뜻이 드러나게 바꿔 문장 전체를 쓰세요.", given: "Tom <u>spilled the beans</u> about the test answers.", a: ["Tom revealed the secret about the test answers.", "Tom revealed a secret about the test answers.", "Tom told the secret about the test answers."], exp: "spill the beans = reveal a secret → 과거형 revealed." },
    { t: "write", q: "밑줄 친 idiom을 뜻이 드러나게 바꿔 문장 전체를 쓰세요.", given: "Thanks for inviting me to dinner, but I'll <u>take a rain check</u>.", a: ["Thanks for inviting me to dinner, but I can't come this time. Maybe next time.", "Thanks for inviting me to dinner, but I cannot come this time. Maybe next time."], exp: "take a rain check = 지금은 정중히 거절(다음에). 거절 + 다음 기약 뜻이 있으면 정답 처리." }
  ]}
];
</script>
<script src="practice.js"></script>
</body>
