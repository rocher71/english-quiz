<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>영어 시험장</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f2ede3; --card: #fbf8f1; --ink: #35322c; --muted: #8a8272;
    --line: #ddd5c4; --accent: #a8402f;
  }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 40px 20px;
  }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 6px; color: var(--accent); }
  h1 { font-family: "Gowun Batang", serif; font-size: clamp(30px, 6vw, 44px); letter-spacing: 3px; margin: 12px 0 34px; }
  nav { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 460px; }
  nav a {
    display: block; background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 20px 24px; text-decoration: none; color: var(--ink);
    box-shadow: 0 2px 8px rgba(53, 50, 44, .06);
  }
  nav a:hover { border-color: var(--accent); }
  nav a .t { font-family: "Gowun Batang", serif; font-weight: 700; font-size: 19px; }
  nav a .d { color: var(--muted); font-size: 13px; margin-top: 4px; }
  footer { margin-top: 40px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
  <div class="eyebrow">2학기 중간고사 대비</div>
  <h1>영어 시험장</h1>
  <nav>
    <a href="words.html">
      <div class="t">단어 시험장 📝</div>
      <div class="d">교과서 WORDS 60문항 · 영영풀이 33문항 · 예문 빈칸 33문항</div>
    </a>
    <a href="passages.html">
      <div class="t">본문 시험장 ✍️</div>
      <div class="d">5·6과 Reading · Dialogues · Extra Reading · 단어 예문 — 영작 &amp; 빈칸</div>
    </a>
  </nav>
  <footer>5과 · 6과 (2학년 동아 이병민) — 6과 단어 유인물은 나오면 추가 예정</footer>
</body>
</html>
