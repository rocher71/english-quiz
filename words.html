<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>단어 시험장</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  :root {
    --bg: #f7f8f5;
    --surface: #ffffff;
    --ink: #1f2823;
    --muted: #6b7570;
    --line: #dde3dd;
    --accent: #2f7d4f;
    --accent-ink: #ffffff;
    --accent-soft: #e7f1ea;
    --good: #2f7d4f;
    --bad: #c14a3a;
    --over: #b07a1f;
    --chip-bg: #f0f3ef;
    --shadow: 0 1px 3px rgba(31, 40, 35, .08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
    font-size: 15px;
    line-height: 1.55;
  }

  /* ── 사이트 내비 ── */
  .sitenav {
    display: flex; gap: 4px; justify-content: center; align-items: center;
    background: var(--ink); padding: 8px 16px;
  }
  .sitenav a {
    color: rgba(255, 255, 255, .75); text-decoration: none;
    font-size: 13px; font-weight: 500; padding: 4px 14px; border-radius: 999px;
  }
  .sitenav a:hover { color: #fff; }
  .sitenav a.on { background: var(--accent); color: #fff; font-weight: 700; }

  /* ── 상단 바 ── */
  #topbar {
    position: sticky; top: 0; z-index: 20;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    box-shadow: var(--shadow);
  }
  #topbar .inner {
    max-width: 760px; margin: 0 auto; padding: 12px 20px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  #topbar h1 { font-size: 17px; font-weight: 700; letter-spacing: -.2px; }
  #topbar h1 small { font-weight: 500; color: var(--muted); font-size: 12px; margin-left: 6px; }
  #progress { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; margin-left: auto; }
  button {
    font-family: inherit; font-size: 14px; font-weight: 500;
    padding: 7px 14px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }

  /* 시험 종류 탭 */
  #typeRow, #lessonRow { max-width: 760px; margin: 14px auto 0; padding: 0 16px; display: flex; gap: 8px; flex-wrap: wrap; }
  #lessonRow { margin-top: 8px; }
  #typeRow button, #lessonRow button { font-size: 13px; border-radius: 999px; padding: 6px 16px; color: var(--muted); }
  #typeRow button.on { background: var(--ink); border-color: var(--ink); color: var(--surface); font-weight: 700; }
  #lessonRow button.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }

  /* ── 점수판 ── */
  #scoreboard {
    max-width: 760px; margin: 14px auto 0; padding: 14px 20px;
    display: none; gap: 20px; align-items: baseline; flex-wrap: wrap;
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  }
  #scoreboard.show { display: flex; }
  #scoreboard .big { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  #scoreboard .big span { color: var(--muted); font-size: 15px; font-weight: 500; }
  #scoreboard .detail { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  #scoreboard .detail b.g { color: var(--good); }
  #scoreboard .detail b.o { color: var(--over); }
  #scoreboard .detail b.b { color: var(--bad); }
  @media (max-width: 800px) { #scoreboard { margin: 14px 16px 0; } }

  /* ── 문항 카드 ── */
  #list { max-width: 760px; margin: 16px auto 60px; padding: 0 16px; display: flex; flex-direction: column; gap: 10px; }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px 14px 18px; position: relative;
  }
  .card::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
    border-radius: 10px 0 0 10px; background: transparent;
  }
  .card.correct::before { background: var(--good); }
  .card.wrong::before { background: var(--bad); }
  .card.override::before { background: var(--over); }

  .card .head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .card .no { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; min-width: 20px; }
  .card .word { font-family: "Lora", Georgia, serif; font-size: 21px; font-weight: 600; letter-spacing: .1px; }
  .card .def { font-family: "Lora", Georgia, serif; font-size: 16px; font-weight: 500; flex: 1; min-width: 200px; }
  .card .exline { font-family: "Lora", Georgia, serif; font-size: 16.5px; line-height: 2; flex: 1; min-width: 200px; }
  .badge {
    font-size: 11px; font-weight: 700; letter-spacing: .5px;
    padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent);
  }
  .verdict { margin-left: auto; font-size: 12px; font-weight: 700; }
  .verdict.g { color: var(--good); }
  .verdict.b { color: var(--bad); }
  .verdict.o { color: var(--over); }

  .card .row { display: flex; gap: 10px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
  .poschips { display: flex; gap: 6px; }
  .poschips label {
    font-size: 13px; font-weight: 500; padding: 4px 12px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--chip-bg); cursor: pointer; user-select: none;
  }
  .poschips label:has(input:checked) { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  .poschips input { position: absolute; opacity: 0; width: 0; }
  .poschips label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }

  .meaning, .wordin {
    font-family: inherit; font-size: 15px; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
    padding: 8px 12px;
  }
  .meaning { flex: 1; min-width: 200px; }
  .wordin { width: 200px; font-family: "Lora", Georgia, serif; }
  .wordin.sentin { width: 100%; font-size: 16px; }
  .meaning:focus, .wordin:focus, .blank:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .meaning::placeholder, .wordin::placeholder { color: var(--muted); opacity: .7; }
  .blank {
    font-family: "Lora", Georgia, serif; font-size: 15.5px; color: var(--ink);
    background: var(--bg); border: none; border-bottom: 2px solid var(--accent);
    padding: 1px 6px; text-align: center;
  }
  .exko { margin-top: 6px; margin-left: 30px; color: var(--muted); font-size: 13.5px; }

  .result { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); font-size: 13px; }
  .card.graded .result { display: block; }
  .result .fail { color: var(--bad); font-weight: 700; margin-right: 8px; }
  .result .ans { color: var(--muted); margin-top: 2px; }
  .result .ans b { color: var(--ink); font-weight: 500; }
  .result .ans .pl { color: var(--accent); font-weight: 700; margin-right: 2px; }
  .result .ans .exq { font-family: "Lora", Georgia, serif; }
  .overbtn { margin-top: 8px; font-size: 12px; padding: 4px 10px; }
  .overbtn.on { background: var(--over); border-color: var(--over); color: #fff; }
  .note { font-size: 11px; color: var(--over); font-weight: 700; margin-left: 6px; }

  footer { max-width: 760px; margin: 0 auto 40px; padding: 0 16px; color: var(--muted); font-size: 12px; }
  footer a { color: var(--accent); }
</style>
</head>

  { w: "unforgettable", form: "unforgettable", mean: ["잊지 못할", "잊을 수 없는"], def: "very special, unusual, beautiful, etc., and therefore difficult or impossible to forget", ex: "The trip was an unforgettable experience.", exko: "그 여행은 잊지 못할 경험이었다." }

// ?exam=final → 2학기 기말(7·8과) 유인물만, 없으면 2학기 중간(5·6과)
const FINAL = new URLSearchParams(location.search).get("exam") === "final";
const SCHOOL = { 5: SCHOOL5, 6: SCHOOL6, 7: SCHOOL7, 8: SCHOOL8 };
const TYPES = [
  ["words", "교과서 WORDS", "5과 · 2학년 동아(이병민)", "품사 다중 선택 + 뜻 작성. part·save는 모든 뜻 필수, 그 외는 품사별 뜻 1개."],
  ["defs", "영영풀이", "학교 유인물", "영영 풀이를 보고 영어 단어와 한글 뜻을 쓰세요. 품사는 없습니다."],
  ["blanks", "예문 빈칸", "학교 유인물", "예문의 빈칸에 알맞은 단어를 쓰세요. ed·s 등 형태까지 정확해야 정답."],
  ["sents", "예문 영작", "학교 유인물", "우리말 뜻을 보고 예문 전체를 영어로 쓰세요. 대소문자·문장부호는 채점하지 않고, 단어는 예문과 똑같아야 정답."]
].filter(t => !FINAL || t[0] !== "words");
const LESSONS = FINAL ? [["7", "7과"], ["8", "8과"], ["78", "7·8 통합"]] : [["5", "5과"], ["6", "6과"], ["56", "5·6 통합"]];
const POS_ALL = ["명", "동", "형", "부"];
let curType = FINAL ? "defs" : "words";
let curLesson = LESSONS[0][0];
if (FINAL) document.title = "단어 시험장 · 기말";
const store = {};   // type|lesson → { order, state: {idx → {...}}, graded: bool }

function bank() {
  if (curType === "words") return WORDS;
  return [...curLesson].flatMap(l => SCHOOL[l]);
}
function skey() { return curType + "|" + (curType === "words" ? "" : curLesson); }
function S() {
  if (!store[skey()]) {
    store[skey()] = { order: bank().map((_, i) => i), state: {}, graded: false };
    shuffleOrder(store[skey()].order);
  }
  return store[skey()];
}
function shuffleOrder(o) {
  for (let i = o.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [o[i], o[j]] = [o[j], o[i]]; }
}
function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function normKo(s) { return s.replace(/\([^)]*\)/g, "").replace(/[^가-힣a-zA-Z0-9]/g, ""); }
function normEn(s) { return s.toLowerCase().replace(/[’‘]/g, "'").replace(/[^a-z0-9]/g, ""); }

function render() {
  const t = TYPES.find(t => t[0] === curType);
  document.getElementById("typeRow").innerHTML = TYPES.map(tt =>
    '<button class="' + (curType === tt[0] ? "on" : "") + '" onclick="setType(\'' + tt[0] + '\')">' + tt[1] + "</button>").join("");
  document.getElementById("lessonRow").innerHTML = curType === "words" ? "" : LESSONS.map(l =>
    '<button class="' + (curLesson === l[0] ? "on" : "") + '" onclick="setLesson(\'' + l[0] + '\')">' + l[1] + "</button>").join("");
  document.getElementById("subTitle").textContent = (FINAL ? "2학기 기말 · " : "2학기 중간 · ") + t[2] + " · " + bank().length + "문항";
  document.getElementById("footNote").textContent = t[3] + " 자동 채점 후 \"정답 처리\"로 선생님이 직접 인정할 수 있어요.";

  const s = S(), list = document.getElementById("list");
  list.innerHTML = "";
  s.order.forEach((idx, i) => {
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.idx = idx;
    card.innerHTML = curType === "words" ? cardWords(idx, i) : curType === "defs" ? cardDefs(idx, i) : curType === "sents" ? cardSents(idx, i) : cardBlanks(idx, i);
    list.appendChild(card);
  });
  document.getElementById("scoreboard").classList.remove("show");
  if (s.graded) applyGrades();
  updateProgress();
}

function cardWords(idx, i) {
  const w = bank()[idx], st = S().state[idx] || {};
  const chips = w.phrase ? '<span class="badge">숙어</span>' :
    '<div class="poschips" role="group" aria-label="품사 선택">' +
    POS_ALL.map(p => '<label>' + p + '<input type="checkbox" value="' + p + '"' + ((st.pos || []).includes(p) ? " checked" : "") + '></label>').join("") +
    "</div>";
  return '<div class="head"><span class="no">' + String(i + 1).padStart(2, "0") + '</span>' +
    '<span class="word">' + esc(w.w) + "</span>" +
    (w.all ? '<span class="note">모든 뜻 필수</span>' : "") +
    '<span class="verdict"></span></div>' +
    '<div class="row">' + chips +
    '<input class="meaning" type="text" value="' + esc(st.mean || "") + '" placeholder="뜻을 입력하세요" autocomplete="off" spellcheck="false">' +
    '</div><div class="result"></div>';
}
function cardDefs(idx, i) {
  const w = bank()[idx], st = S().state[idx] || {};
  return '<div class="head"><span class="no">' + String(i + 1).padStart(2, "0") + '</span>' +
    '<span class="def">' + esc(w.def) + '</span><span class="verdict"></span></div>' +
    '<div class="row">' +
    '<input class="wordin" type="text" value="' + esc(st.word || "") + '" placeholder="영어 단어" autocomplete="off" spellcheck="false">' +
    '<input class="meaning" type="text" value="' + esc(st.mean || "") + '" placeholder="한글 뜻" autocomplete="off" spellcheck="false">' +
    '</div><div class="result"></div>';
}
function cardSents(idx, i) {
  const w = bank()[idx], st = S().state[idx] || {};
  return '<div class="head"><span class="no">' + String(i + 1).padStart(2, "0") + '</span>' +
    '<span class="def">' + esc(w.exko) + '</span><span class="verdict"></span></div>' +
    '<div class="row"><input class="wordin sentin" type="text" value="' + esc(st.word || "") + '" placeholder="예문 전체를 영어로" autocomplete="off" spellcheck="false"></div>' +
    '<div class="result"></div>';
}
function cardBlanks(idx, i) {
  const w = bank()[idx], st = S().state[idx] || {};
  const at = w.ex.indexOf(w.form);
  const pre = w.ex.slice(0, at), post = w.ex.slice(at + w.form.length);
  return '<div class="head"><span class="no">' + String(i + 1).padStart(2, "0") + '</span>' +
    '<span class="exline">' + esc(pre) +
    '<input class="blank" type="text" size="' + Math.max(6, w.form.length) + '" value="' + esc(st.word || "") + '" autocomplete="off" spellcheck="false">' +
    esc(post) + '</span><span class="verdict"></span></div>' +
    '<div class="exko">' + esc(w.exko) + '</div><div class="result"></div>';
}

document.addEventListener("input", e => {
  const card = e.target.closest(".card"); if (!card) return;
  const s = S(), idx = +card.dataset.idx;
  const st = s.state[idx] = s.state[idx] || {};
  if (e.target.classList.contains("meaning")) st.mean = e.target.value;
  else if (e.target.classList.contains("wordin") || e.target.classList.contains("blank")) st.word = e.target.value;
  updateProgress();
});
document.addEventListener("change", e => {
  if (!e.target.matches(".poschips input")) return;
  const card = e.target.closest(".card");
  const s = S(), idx = +card.dataset.idx;
  const st = s.state[idx] = s.state[idx] || {};
  st.pos = [...card.querySelectorAll(".poschips input:checked")].map(i => i.value);
});
document.addEventListener("keydown", e => {
  if (e.key !== "Enter" || !e.target.matches(".meaning, .wordin, .blank")) return;
  const all = [...document.querySelectorAll(".meaning, .wordin, .blank")];
  const next = all[all.indexOf(e.target) + 1];
  if (next) { next.focus(); next.scrollIntoView({ block: "center" }); }
});

function updateProgress() {
  const s = S();
  const done = s.order.filter(idx => {
    const st = s.state[idx] || {};
    if (curType === "words") return (st.mean || "").trim();
    if (curType === "defs") return (st.word || "").trim() && (st.mean || "").trim();
    return (st.word || "").trim();
  }).length;
  document.getElementById("progress").textContent = "작성 " + done + " / " + s.order.length;
}

function setType(t) { curType = t; render(); window.scrollTo({ top: 0 }); }
function setLesson(l) { curLesson = l; render(); window.scrollTo({ top: 0 }); }
function shuffleAll() {
  const s = S();
  shuffleOrder(s.order);
  s.state = {}; s.graded = false;
  render(); window.scrollTo({ top: 0 });
}

function gradeItem(idx) {
  const s = S(), st = s.state[idx] || {};
  const fails = [];
  if (curType === "words") {
    const w = bank()[idx];
    if (!w.phrase) {
      const sel = (st.pos || []).slice().sort().join(",");
      if (sel !== [...w.pos].sort().join(",")) fails.push("품사");
    }
    const ans = normKo(st.mean || "");
    const meanOK = w.mean.every(block => {
      const hit = block.groups.filter(g => g.some(alt => { const k = normKo(alt); return k && ans.includes(k); })).length;
      return w.all ? hit === block.groups.length : hit >= 1;
    });
    if (!meanOK) fails.push("뜻");
  } else if (curType === "defs") {
    const w = bank()[idx];
    if (normEn(st.word || "") !== normEn(w.w)) fails.push("단어");
    const ans = normKo(st.mean || "");
    if (!w.mean.some(alt => ans.includes(normKo(alt)))) fails.push("뜻");
  } else if (curType === "sents") {
    if (normEn(st.word || "") !== normEn(bank()[idx].ex)) fails.push("문장");
  } else {
    const w = bank()[idx];
    if (normEn(st.word || "") !== normEn(w.form)) fails.push("빈칸");
  }
  return fails;
}

function answerHTML(idx) {
  if (curType === "words") {
    const w = bank()[idx];
    return w.mean.map(b =>
      (b.pos ? '<span class="pl">[' + b.pos + "]</span>" : "") +
      "<b>" + b.groups.map(g => g[0]).join("; ") + "</b>").join("　");
  }
  const w = bank()[idx];
  if (curType === "defs")
    return "<b>" + esc(w.w) + "</b> — " + esc(w.mean.join(", ")) +
      '<br><span class="exq">' + esc(w.ex) + "</span> " + esc(w.exko);
  if (curType === "sents") return '<b class="exq">' + esc(w.ex) + "</b>";
  return "<b>" + esc(w.form) + "</b>" + (w.form !== w.w ? " (" + esc(w.w) + ")" : "") + " — " + esc(w.mean.join(", "));
}

function gradeAll() {
  const s = S();
  s.graded = true;
  s.order.forEach(idx => { (s.state[idx] = s.state[idx] || {}).fails = gradeItem(idx); });
  applyGrades();
  document.getElementById("scoreboard").classList.add("show");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function applyGrades() {
  const s = S();
  let auto = 0, over = 0, wrong = 0;
  document.querySelectorAll(".card").forEach(card => {
    const idx = +card.dataset.idx;
    const st = s.state[idx];
    if (!st || !st.fails) return;
    card.classList.add("graded");
    card.classList.remove("correct", "wrong", "override");
    const v = card.querySelector(".verdict"), res = card.querySelector(".result");
    if (!st.fails.length) {
      auto++;
      card.classList.add("correct"); v.textContent = "정답"; v.className = "verdict g";
      res.innerHTML = '<div class="ans">' + answerHTML(idx) + "</div>";
    } else {
      if (st.over) { over++; card.classList.add("override"); v.textContent = "선생님 인정"; v.className = "verdict o"; }
      else { wrong++; card.classList.add("wrong"); v.textContent = "오답"; v.className = "verdict b"; }
      res.innerHTML =
        st.fails.map(f => '<span class="fail">✗ ' + f + "</span>").join("") +
        '<div class="ans">정답: ' + answerHTML(idx) + "</div>" +
        '<button class="overbtn' + (st.over ? " on" : "") + '" onclick="toggleOver(this)">' +
        (st.over ? "✓ 선생님 인정됨 (취소)" : "정답 처리") + "</button>";
    }
  });
  document.getElementById("scoreN").textContent = auto + over;
  document.getElementById("scoreT").textContent = " / " + s.order.length;
  document.getElementById("cAuto").textContent = auto;
  document.getElementById("cOver").textContent = over;
  document.getElementById("cWrong").textContent = wrong;
  document.getElementById("scoreboard").classList.add("show");
}

function toggleOver(btn) {
  const card = btn.closest(".card");
  const st = S().state[+card.dataset.idx];
  st.over = !st.over;
  applyGrades();
}

render();
</script>
</body>
</html>
