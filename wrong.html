<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>오답 노트</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Lora:wght@500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f2ede3; --card: #fbf8f1; --ink: #35322c; --muted: #8a8272;
    --line: #ddd5c4; --accent: #a8402f; --good: #4f7a4a; --bad: #a8402f; --bad-soft: #f6e5e1; --over: #b07a1f;
  }
  body { background: var(--bg); color: var(--ink); font-family: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; font-size: 15px; line-height: 1.55; }
  .sitenav { display: flex; gap: 4px; justify-content: center; align-items: center; flex-wrap: wrap; background: var(--ink); padding: 8px 16px; }
  .sitenav a { color: rgba(255,255,255,.75); text-decoration: none; font-size: 13px; font-weight: 500; padding: 4px 14px; border-radius: 999px; }
  .sitenav a:hover { color: #fff; }
  .sitenav a.on { background: var(--accent); color: #fff; font-weight: 700; }
  header { text-align: center; padding: 40px 16px 6px; }
  header h1 { font-family: "Gowun Batang", serif; font-size: clamp(28px, 6vw, 38px); letter-spacing: 2px; }
  #summary { color: var(--muted); font-size: 14px; margin-top: 6px; }
  #summary b { color: var(--bad); }
  button { font-family: inherit; font-size: 13px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--muted); cursor: pointer; }
  button.on { background: var(--ink); border-color: var(--ink); color: #fff; font-weight: 700; }
  button.big { display: block; width: 100%; border-radius: 8px; padding: 13px; font-size: 16px; font-weight: 700; background: var(--accent); border-color: var(--accent); color: #fff; }
  button:focus-visible, a:focus-visible, summary:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }
  #controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 14px; }
  main { max-width: 760px; margin: 18px auto 40px; padding: 0 16px; display: flex; flex-direction: column; gap: 14px; }

  /* 목록 */
  .group { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .ghead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .ghead .t { font-weight: 700; }
  .ghead .c { color: var(--muted); font-size: 13px; }
  .row { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; padding: 10px 16px; border-top: 1px dashed var(--line); align-items: start; }
  .row:first-of-type { border-top: none; }
  .row.solved { opacity: .55; }
  .n { font-size: 12px; font-weight: 700; color: var(--bad); background: var(--bad-soft); border-radius: 999px; padding: 2px 9px; white-space: nowrap; margin-top: 2px; }
  .row.solved .n { color: var(--good); background: #e5eee3; }
  .q { min-width: 0; overflow-wrap: anywhere; }
  .meta { font-size: 12px; color: var(--muted); }
  details { margin-top: 4px; font-size: 13.5px; }
  summary { cursor: pointer; color: var(--muted); font-size: 12.5px; width: fit-content; }
  details .a { font-family: "Lora", Georgia, serif; margin-top: 2px; }
  .del { border: none; background: none; color: var(--muted); font-size: 16px; padding: 0 4px; border-radius: 4px; }
  .del:hover { color: var(--bad); }
  .empty { text-align: center; color: var(--muted); padding: 40px 16px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  .legacy { font-size: 13px; color: var(--muted); background: var(--card); border: 1px dashed var(--line); border-radius: 10px; padding: 12px 16px; }
  .legacy a { color: var(--accent); margin-right: 10px; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 0 16px 40px; }
  footer button { margin-top: 10px; }

  /* 전체 다시 풀기 */
  #pbar { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line); }
  #pbar .wrap { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 16px; }
  #pmsg { font-size: 13.5px; margin-right: auto; }
  #pmsg b.g { color: var(--good); } #pmsg b.b { color: var(--bad); } #pmsg b.o { color: var(--over); }
  #pbar button { border-radius: 7px; }
  #pbar button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  .item { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 10px; padding: 12px 16px; }
  .item.correct { border-left-color: var(--good); } .item.wrong { border-left-color: var(--bad); } .item.override { border-left-color: var(--over); }
  .item .top { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .item .top .cnt { color: var(--bad); font-weight: 700; }
  .item .verdict { margin-left: auto; font-weight: 700; }
  .verdict.g { color: var(--good); } .verdict.b { color: var(--bad); } .verdict.o { color: var(--over); }
  .item .p { font-family: "Lora", Georgia, serif; font-size: 16px; line-height: 2; overflow-wrap: anywhere; }
  .item .p .word { font-size: 21px; font-weight: 600; }
  .item .p .sub { font-family: "Noto Sans KR", sans-serif; font-size: 13.5px; color: var(--muted); line-height: 1.5; }
  .item .p .given { font-size: 15px; background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; margin-top: 6px; line-height: 1.6; }
  .fin { font-family: "Lora", Georgia, serif; font-size: 15px; color: var(--ink); background: #fff; border: none; border-bottom: 2px solid var(--accent); padding: 1px 4px; text-align: center; }
  .frow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; align-items: center; }
  .frow .fin { border: 1px solid var(--line); border-radius: 4px; padding: 7px 10px; text-align: left; flex: 1; min-width: 140px; }
  .frow .fin.wide { flex-basis: 100%; }
  .chips { display: flex; gap: 6px; }
  .chips label { font-size: 13px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; cursor: pointer; background: #fff; }
  .chips label:has(input:checked) { background: var(--ink); color: #fff; border-color: var(--ink); }
  .chips input { position: absolute; opacity: 0; pointer-events: none; }
  .opts { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .opt { text-align: left; border-radius: 7px; font-size: 14.5px; color: var(--ink); background: #fff; }
  .pk { border-radius: 4px; padding: 0 8px; font-size: 15px; color: var(--ink); background: #fff; font-family: "Lora", Georgia, serif; }
  .opt.sel, .pk.sel { background: var(--ink); color: #fff; border-color: var(--ink); }
  .fails { color: var(--bad); font-size: 13px; font-weight: 700; margin-top: 8px; }
  .ans { margin-top: 8px; font-size: 13.5px; color: var(--muted); }
  .ans b { font-family: "Lora", Georgia, serif; color: var(--ink); font-weight: 500; }
  .btnrow { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .btnrow button { border-radius: 6px; font-size: 12px; padding: 4px 10px; color: var(--ink); }
  .btnrow button.on { background: var(--over); border-color: var(--over); color: #fff; }
</style>
</head>

</nav>

<!-- 목록 화면 -->
<div id="listView">
  <header>
    <h1>오답 노트</h1>
    <div id="summary"></div>
  </header>
  <div class="wrap" style="margin-top:16px"><button class="big" id="startBtn" onclick="startPractice()">❗ 오답 전체 다시 풀기</button></div>
  <div id="controls" class="wrap">
    <button id="fTodo" onclick="view.all = false; renderList()">다시 풀 것만</button>
    <button id="fAll" onclick="view.all = true; renderList()">해결한 것도 보기</button>
    <span style="width:8px"></span>
    <button id="sCnt" onclick="view.sort = 'n'; renderList()">많이 틀린 순</button>
    <button id="sNew" onclick="view.sort = 't'; renderList()">최근 순</button>
  </div>
  <main id="list"></main>
  <footer>
    시험장에서 채점할 때 틀린 문제가 자동으로 모여요. 같은 시험에서 같은 답으로 다시 채점하면 횟수는 늘지 않아요.<br>
    "전체 다시 풀기"에서 정답 공개 없이 맞히면 해결로 바뀌어요. 이 기기·브라우저에만 저장돼요.<br>
    <button onclick="clearAll()">오답 노트 전체 지우기</button>
  </footer>
</div>

<!-- 전체 다시 풀기 화면 -->
<div id="practiceView" hidden>
  <div id="pbar"><div class="wrap">
    <span id="pmsg"></span>
    <button onclick="startPractice()">🔀 새로 섞기</button>
    <button onclick="showList()">목록으로</button>
    <button class="primary gradebtn" onclick="gradeAll()">채점하기</button>
  </div></div>
  <main id="plist"></main>
  <div class="wrap" style="margin-bottom:40px"><button class="big gradebtn" onclick="gradeAll()">채점하기</button></div>
</div>

<script src="wrongbook.js"></script>
<script>
const view = { all: false, sort: "n" };
const POS_ALL = ["명", "동", "형", "부"], NUMS = "①②③④⑤";
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function norm(s) { return s.toLowerCase().replace(/[’‘]/g, "'").replace(/[^a-z0-9]/g, ""); }
function normKo(s) { return s.replace(/\([^)]*\)/g, "").replace(/[^가-힣a-zA-Z0-9]/g, ""); }
function when(t) { const d = new Date(t); return (d.getMonth() + 1) + "/" + d.getDate() + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }
function records() { return Object.entries(WB.load()).map(([id, r]) => ({ id, ...r })); }

// ───────── 목록 ─────────
function renderList() {
  const all = records(), todo = all.filter(r => !r.ok);
  document.getElementById("summary").innerHTML = all.length
    ? "다시 풀 오답 <b>" + todo.length + "</b>개 · 해결 " + (all.length - todo.length) + "개 · 총 틀린 횟수 " + all.reduce((a, r) => a + r.n, 0) + "회"
    : "";
  const sb = document.getElementById("startBtn");
  sb.hidden = !todo.length;
  sb.textContent = "❗ 오답 전체 다시 풀기 (" + todo.length + "문항)";
  [["fTodo", !view.all], ["fAll", view.all], ["sCnt", view.sort === "n"], ["sNew", view.sort === "t"]]
    .forEach(([id, on]) => document.getElementById(id).classList.toggle("on", on));

  const shown = (view.all ? all : todo).sort((a, b) => view.sort === "n" ? b.n - a.n || b.t - a.t : b.t - a.t);
  const groups = {};
  shown.forEach(r => (groups[r.g] = groups[r.g] || []).push(r));
  const names = Object.keys(groups).sort((a, b) => a.localeCompare(b, "ko"));
  document.getElementById("list").innerHTML = names.length ? names.map(g => {
    const rs = groups[g];
    return '<div class="group"><div class="ghead"><span class="t">' + esc(g) + '</span><span class="c">' + rs.filter(r => !r.ok).length + "문항</span></div>" +
      rs.map(r => '<div class="row' + (r.ok ? " solved" : "") + '">' +
        '<span class="n">' + (r.ok ? "✓ " : "✗ ") + r.n + "회</span>" +
        '<div class="q">' + esc(r.q) + '<div class="meta">마지막 오답 ' + when(r.t) + (r.ok ? " · 해결" : "") + "</div>" +
        '<details><summary>정답 보기</summary><div class="a">' + esc(r.a) + "</div></details></div>" +
        '<button class="del" title="오답 노트에서 지우기" aria-label="지우기" data-id="' + esc(r.id) + '">✕</button></div>').join("") +
      "</div>";
  }).join("") : '<div class="empty">' + (all.length ? "다시 풀 오답이 없어요 🎉 (해결한 것도 보기로 지난 오답 확인)" : "아직 오답이 없어요. 시험장에서 채점하면 틀린 문제가 여기 모여요.") + "</div>";
}
document.addEventListener("click", e => {
  const b = e.target.closest(".del");
  if (!b) return;
  const d = WB.load(); delete d[b.dataset.id]; WB.save(d); renderList();
});
function clearAll() {
  if (!confirm("오답 노트를 전부 지울까요? 되돌릴 수 없어요.")) return;
  WB.save({}); renderList();
}

// ───────── 전체 다시 풀기 ─────────
// P.items = 시작할 때 찍어 둔 미해결 오답(풀다가 해결돼도 화면에선 안 사라짐)
let P = null;
function startPractice() {
  const todo = records().filter(r => !r.ok);
  const items = todo.filter(r => r.x);
  for (let i = items.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [items[i], items[j]] = [items[j], items[i]]; }
  P = { items, legacy: todo.filter(r => !r.x), ans: {}, graded: null, open: {}, over: {}, wb: {} };
  document.getElementById("listView").hidden = true;
  document.getElementById("practiceView").hidden = false;
  renderPractice();
  window.scrollTo({ top: 0 });
}
function showList() {
  P = null;
  document.getElementById("practiceView").hidden = true;
  document.getElementById("listView").hidden = false;
  renderList();
  window.scrollTo({ top: 0 });
}
const wbs = id => P.wb[id] = P.wb[id] || {};
const A = id => P.ans[id] = P.ans[id] || {};

function fieldHTML(r, j, inline) {
  const f = r.x.f[j], v = A(r.id)[j], k = ' data-id="' + esc(r.id) + '" data-j="' + j + '"';
  if (f.t === "pos") return '<span class="chips">' + POS_ALL.map(p => '<label>' + p + '<input type="checkbox" value="' + p + '"' + k + ((v || []).includes(p) ? " checked" : "") + "></label>").join("") + "</span>";
  if (f.t === "choice") return f.inline
    ? f.o.map((o, i) => '<button class="pk' + (v === i ? " sel" : "") + '"' + k + ' data-i="' + i + '">' + o + "</button>").join(" / ")
    : '<div class="opts">' + f.o.map((o, i) => '<button class="opt' + (v === i ? " sel" : "") + '"' + k + ' data-i="' + i + '">' + o + "</button>").join("") + "</div>";
  const size = inline ? ' size="' + Math.max(5, (f.a[0] || "").length) + '"' : "";
  return '<input class="fin' + (f.wide ? " wide" : "") + '"' + k + size + ' value="' + esc(v || "") + '" placeholder="' + esc(f.ph || "") + '" autocomplete="off" spellcheck="false">';
}
function renderItem(r, no) {
  const used = new Set();
  // r.x.p 는 시험장 페이지가 만든 문제 HTML(사이트 자체 데이터)
  const p = r.x.p.replace(/⟦(\d+)⟧/g, (_, j) => { used.add(+j); return fieldHTML(r, +j, true); });
  const rest = r.x.f.map((f, j) => used.has(j) ? "" : fieldHTML(r, j, false)).join("");
  return '<div class="item" data-id="' + esc(r.id) + '"><div class="top"><span>' + String(no).padStart(2, "0") + "</span><span>" + esc(r.g) + '</span><span class="cnt">✗ ' + r.n + '회</span><span class="verdict"></span></div>' +
    '<div class="p">' + p + "</div>" + (rest ? '<div class="frow">' + rest + "</div>" : "") + '<div class="res"></div></div>';
}
function renderPractice() {
  const T = P.items.length;
  let html = P.items.map((r, i) => renderItem(r, i + 1)).join("");
  if (P.legacy.length) {
    // 이 기능 전에 쌓인 오답은 문제 정보가 없어서 원래 시험장에서 풀어야 함
    const urls = {};
    P.legacy.forEach(r => urls[r.url] = r.g);
    html += '<div class="legacy">예전 기록 ' + P.legacy.length + "개는 원래 시험장에서 다시 풀어야 해요 (한 번 다시 채점하면 다음부턴 여기로 모여요): " +
      Object.entries(urls).map(([u, g]) => '<a href="' + esc(u) + '">' + esc(g) + "</a>").join("") + "</div>";
  }
  if (!T && !P.legacy.length) html = '<div class="empty">다시 풀 오답이 없어요 🎉</div>';
  document.getElementById("plist").innerHTML = html;
  document.querySelectorAll(".gradebtn").forEach(b => b.hidden = !T);
  setGB(P.graded ? "다시 채점" : "채점하기");
  if (P.graded) applyGrades();
  else updateMsg();
}
function updateMsg() {
  const done = P.items.filter(r => r.x.f.every((f, j) => { const v = A(r.id)[j]; return typeof v === "number" || (v && v.length); })).length;
  document.getElementById("pmsg").textContent = "오답 전체 다시 풀기 · 작성 " + done + " / " + P.items.length;
}

document.addEventListener("input", e => {
  const t = e.target;
  if (!P || t.dataset.j === undefined) return;
  if (t.type === "checkbox") A(t.dataset.id)[t.dataset.j] = [...t.closest(".chips").querySelectorAll("input:checked")].map(i => i.value);
  else A(t.dataset.id)[t.dataset.j] = t.value;
  if (!P.graded) updateMsg();
});
document.addEventListener("click", e => {
  const b = e.target.closest(".opt, .pk");
  if (!b || !P) return;
  A(b.dataset.id)[b.dataset.j] = +b.dataset.i;
  b.parentElement.querySelectorAll(".opt, .pk").forEach(x => x.classList.toggle("sel", x === b));
  if (!P.graded) updateMsg();
});
document.addEventListener("keydown", e => {
  if (e.key !== "Enter" || !e.target.classList.contains("fin")) return;
  const all = [...document.querySelectorAll(".fin")];
  const next = all[all.indexOf(e.target) + 1];
  if (next) { next.focus(); next.scrollIntoView({ block: "center" }); }
});

// 칸 채점: 시험장 페이지와 같은 규칙
function checkField(f, v) {
  if (f.t === "choice") return v === f.a;
  if (f.t === "pos") return (v || []).slice().sort().join(",") === [...f.a].sort().join(",");
  if (f.t === "en") return f.a.some(x => norm(x) === norm(v || ""));
  const ans = normKo(v || "");
  if (f.t === "ko") return f.a.some(x => { const k = normKo(x); return k && ans.includes(k); });
  // kog: 품사 블록마다 의미 그룹 1개(all이면 전부) 이상
  return f.a.every(block => {
    const hit = block.groups.filter(g => g.some(alt => { const k = normKo(alt); return k && ans.includes(k); })).length;
    return f.all ? hit === block.groups.length : hit >= 1;
  });
}
const info = r => ({ g: r.g, url: r.url, q: r.q, a: r.a, e: r.e, x: r.x });
function gradeAll() {
  P.graded = {};
  P.items.forEach(r => {
    const fails = r.x.f.map((f, j) => checkField(f, A(r.id)[j]) ? null : (f.l || "")).filter(x => x !== null);
    P.graded[r.id] = fails;
    const blank = !Object.values(A(r.id)).some(v => typeof v === "number" || (v && v.length && String(v).trim()));
    if (!fails.length || !P.over[r.id]) WB.grade(r.id, !fails.length, blank ? null : JSON.stringify(P.ans[r.id]), wbs(r.id), info(r));
  });
  setGB("다시 채점");
  applyGrades();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function applyGrades() {
  let ok = 0, over = 0, wrong = 0;
  P.items.forEach(r => {
    const card = [...document.querySelectorAll(".item")].find(c => c.dataset.id === r.id);
    const fails = P.graded[r.id], od = P.over[r.id], op = P.open[r.id];
    const v = card.querySelector(".verdict"), res = card.querySelector(".res");
    card.classList.remove("correct", "wrong", "override");
    if (!fails.length) { ok++; card.classList.add("correct"); v.textContent = "정답"; v.className = "verdict g"; res.innerHTML = ""; return; }
    if (od) { over++; card.classList.add("override"); v.textContent = "선생님 인정"; v.className = "verdict o"; }
    else { wrong++; card.classList.add("wrong"); v.textContent = "오답"; v.className = "verdict b"; }
    const labels = fails.filter(Boolean);
    res.innerHTML = (labels.length ? '<div class="fails">' + labels.map(l => "✗ " + esc(l)).join("　") + "</div>" : "") +
      (op ? '<div class="ans">정답: <b>' + esc(r.a) + "</b>" + (r.e ? "<br>" + esc(r.e) : "") + "</div>" : "") +
      '<div class="btnrow"><button class="' + (op ? "on" : "") + '" onclick="toggleOpen(this)">' + (op ? "정답 닫기" : "정답 공개") + "</button>" +
      (op ? '<button class="' + (od ? "on" : "") + '" onclick="toggleOver(this)">' + (od ? "✓ 선생님 인정됨 (취소)" : "정답 처리") + "</button>" : "") + "</div>";
  });
  const T = P.items.length;
  document.getElementById("pmsg").innerHTML = "<b class='g'>" + (ok + over) + "</b> / " + T + " 정답　·　자동 <b class='g'>" + ok + "</b> · 인정 <b class='o'>" + over + "</b> · 오답 <b class='b'>" + wrong + "</b>";
}
const rec = btn => P.items.find(r => r.id === btn.closest(".item").dataset.id);
function toggleOpen(btn) {
  const r = rec(btn);
  P.open[r.id] = !P.open[r.id];
  if (P.open[r.id]) WB.reveal(wbs(r.id));
  applyGrades();
}
function toggleOver(btn) {
  const r = rec(btn);
  P.over[r.id] = !P.over[r.id];
  if (P.over[r.id]) WB.forgive(r.id, wbs(r.id)); else WB.grade(r.id, false, JSON.stringify(P.ans[r.id] || {}), wbs(r.id), info(r));
  applyGrades();
}

// 다른 탭에서 채점하면 목록에 바로 반영 (풀고 있는 중엔 건드리지 않음)
window.addEventListener("storage", () => { if (!P) renderList(); });
window.addEventListener("pageshow", () => { if (!P) renderList(); });
renderList();
</script>
