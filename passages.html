<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>5·6과 본문 시험장</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Lora:ital,wght@0,500;0,600;1,500&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f2ede3;
    --card: #fbf8f1;
    --ink: #35322c;
    --muted: #8a8272;
    --line: #ddd5c4;
    --accent: #a8402f;
    --accent-soft: #f4e3df;
    --good: #3d7a4e;
    --good-soft: #e6efe7;
    --bad: #a8402f;
    --bad-soft: #f6e5e1;
    --over: #a07417;
    --over-soft: #f3ecd9;
  }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
    font-size: 15px; line-height: 1.6;
    padding-bottom: 80px;
  }
  header { text-align: center; padding: 44px 16px 8px; }
  .eyebrow {
    font-size: 12px; font-weight: 700; letter-spacing: 6px;
    color: var(--accent); text-transform: uppercase;
  }
  h1 {
    font-family: "Gowun Batang", serif; font-weight: 700;
    font-size: clamp(28px, 5vw, 42px); letter-spacing: 2px;
    margin-top: 10px; text-wrap: balance;
  }
  .lede { color: var(--muted); font-size: 14px; margin-top: 10px; }

  /* ── 탭들 ── */
  #lessonTabs { display: flex; justify-content: center; gap: 6px; margin-top: 34px; }
  #lessonTabs button {
    font-family: "Gowun Batang", serif; font-weight: 700; font-size: 15px;
    padding: 10px 22px 8px; cursor: pointer;
    border: 1px solid var(--line); border-bottom: none;
    border-radius: 10px 10px 0 0; background: #ece5d6; color: var(--muted);
  }
  #lessonTabs button.on { background: var(--card); color: var(--ink); transform: translateY(1px); }
  #partRow { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; padding: 18px 16px 0; }
  #partRow button {
    font-size: 13px; font-weight: 500; padding: 6px 16px; cursor: pointer;
    border: 1px solid var(--line); border-radius: 999px; background: var(--card); color: var(--muted);
  }
  #partRow button.on { background: var(--ink); border-color: var(--ink); color: var(--card); font-weight: 700; }
  #modeRow { display: flex; justify-content: center; margin-top: 12px; }
  #modeRow .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--card); }
  #modeRow button {
    font-size: 13px; font-weight: 500; padding: 7px 18px; cursor: pointer;
    border: none; background: transparent; color: var(--muted);
  }
  #modeRow button.on { background: var(--accent); color: #fff; font-weight: 700; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* ── 시험지 ── */
  #paper {
    max-width: 780px; margin: 0 auto; background: var(--card);
    border: 1px solid var(--line); border-radius: 4px;
    box-shadow: 0 2px 10px rgba(53, 50, 44, .07);
    padding: 26px 30px 40px;
  }
  @media (max-width: 820px) { #paper { margin: 0 12px; padding: 20px 16px 32px; } }

  #statusbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-bottom: 18px; }
  #statusMsg { font-size: 13px; color: var(--muted); }
  #statusMsg b.g { color: var(--good); }
  #statusMsg b.o { color: var(--over); }
  #statusMsg b.b { color: var(--bad); }
  #fillCount { margin-left: auto; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  #statusbar .btn {
    font-family: inherit; font-size: 13px; font-weight: 500; padding: 7px 14px;
    border: 1px solid var(--line); border-radius: 7px; background: var(--card); cursor: pointer; color: var(--ink);
  }
  #statusbar .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  #statusbar .btn.hinton { background: var(--over-soft); border-color: var(--over); color: var(--over); }

  .section { margin-top: 26px; }
  .sechead { display: flex; align-items: baseline; gap: 10px; border-bottom: 2px solid var(--ink); padding-bottom: 6px; }
  .sechead .range { font-family: "Lora", serif; font-style: italic; color: var(--accent); font-size: 14px; font-weight: 600; }
  .sechead .st { font-family: "Gowun Batang", serif; font-weight: 700; font-size: 17px; }
  .sechead .ss { font-size: 12px; color: var(--muted); }

  .item { padding: 16px 0 14px; border-bottom: 1px dashed var(--line); position: relative; }
  .item .top { display: flex; gap: 10px; align-items: baseline; }
  .item .no { font-family: "Lora", serif; font-size: 13px; color: var(--muted); min-width: 24px; font-variant-numeric: tabular-nums; }
  .sp {
    font-size: 11px; font-weight: 700; color: var(--accent);
    background: var(--accent-soft); border-radius: 4px; padding: 1px 7px;
    align-self: center; white-space: nowrap;
  }
  .ko { font-size: 15px; }
  .en-line { font-family: "Lora", Georgia, serif; font-size: 16.5px; line-height: 2.1; }
  .verdict { position: absolute; right: 0; top: 14px; font-size: 12px; font-weight: 700; }
  .verdict.g { color: var(--good); }
  .verdict.b { color: var(--bad); }
  .verdict.o { color: var(--over); }
  .item.correct { box-shadow: inset 3px 0 0 var(--good); padding-left: 10px; }
  .item.wrong { box-shadow: inset 3px 0 0 var(--bad); padding-left: 10px; }
  .item.override { box-shadow: inset 3px 0 0 var(--over); padding-left: 10px; }

  .writein {
    display: block; width: calc(100% - 34px); margin: 10px 0 0 34px;
    font-family: "Lora", Georgia, serif; font-size: 15.5px; color: var(--ink);
    background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 9px 12px;
  }
  .writein::placeholder { font-style: italic; color: #b6ad9a; }
  .blank {
    font-family: "Lora", Georgia, serif; font-size: 15px; color: var(--ink);
    background: #fff; border: none; border-bottom: 2px solid var(--accent);
    padding: 1px 4px; text-align: center;
  }
  .blank.hint::placeholder { color: var(--over); font-weight: 600; }
  .item .answer { margin: 8px 0 0 34px; font-size: 13.5px; color: var(--muted); }
  .item .answer b { font-family: "Lora", serif; color: var(--ink); font-weight: 500; }
  .overbtn {
    margin: 8px 0 0 34px; font-family: inherit; font-size: 12px; padding: 4px 10px;
    border: 1px solid var(--line); border-radius: 6px; background: var(--card); cursor: pointer; color: var(--ink);
  }
  .overbtn.on { background: var(--over); border-color: var(--over); color: #fff; }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 30px; }
</style>
</head>
<body>

<header>
  <div class="eyebrow">2학기 중간고사 · 5과 &amp; 6과</div>
  <h1>본문 시험장</h1>
  <div class="lede">Reading · Dialogues · Extra Reading · 단어 예문 — 뜻 보고 영작하거나, 빈칸을 채운 뒤 채점하세요.</div>
</header>

<div id="lessonTabs"></div>
<div id="partRow"></div>
<div id="modeRow"><div class="seg" id="modeSeg"></div></div>
<div style="height:16px"></div>

<div id="paper">
  <div id="statusbar">
    <span id="statusMsg">아직 채점 전</span>
    <span id="fillCount"></span>
    <button class="btn" id="shuffleBtn" onclick="reBlank()">셔플 · 새 시험</button>
    <button class="btn" id="hintBtn" onclick="toggleHint()">힌트(첫 글자)</button>
    <button class="btn" onclick="resetView()">다시 풀기</button>
    <button class="btn primary" onclick="gradeAll()">채점하기</button>
  </div>
  <div id="content"></div>
  <footer>채점 후 애매한 답은 각 문항의 "정답 처리"로 선생님이 직접 인정할 수 있어요.</footer>
</div>

    ],
    extra: [

        ["Photo Contest", "We won first place in a school photo contest.", "우리는 학교 사진 경연 대회에서 1등을 했다."],
        ["Photo Contest", "This photo was taken in front of a huge tree.", "이 사진은 거대한 나무 앞에서 찍혔다."],

        ["Volunteer Day", "It was good for the Earth and our health.", "그것은 지구와 우리의 건강에 좋았다."],

        ["Field Trip", "We tried many rides, and we watched an amazing parade!", "많은 놀이기구를 타 보았고 멋진 퍼레이드를 보았다!"]
      ]},
      { t: "Check Up", s: "교내 방송", items: [
        ["W", "Good morning, students.", "안녕하세요, 학생 여러분."],
        ["W", "Today, I want to tell you something important.", "오늘 저는 여러분에게 중요한 것을 말씀드리고 싶습니다."],
        ["W", "In the last few days, I heard some students talking loudly in the library.", "지난 며칠 동안, 저는 도서관에서 몇몇 학생들이 큰 소리로 이야기하는 것을 들었습니다."],
        ["W", "Every student must be quiet in the library.", "모든 학생은 도서관에서 조용히 해야 합니다."],
        ["W", "Let's follow this rule.", "이 규칙을 따르도록 합시다."]

const PARTS = [["reading", "Reading"], ["dialogues", "Dialogues"], ["extra", "Extra Reading"], ["vocab", "단어 예문"]];
const MODES = [["write", "뜻 보고 영작"], ["blank", "빈칸 채우기"]];
let cur = { lesson: "5", part: "reading", mode: "write" };
const store = {};   // viewKey → { ans:{}, blanks:{}, graded:{}, over:{}, hint:false }

function vk() { return cur.lesson + "|" + cur.part + "|" + cur.mode; }
function st() { return store[vk()] = store[vk()] || { ans: {}, blanks: {}, graded: null, over: {}, hint: false }; }
function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function norm(s) { return s.toLowerCase().replace(/[’‘]/g, "'").replace(/[^a-z0-9]/g, ""); }

const STOP = new Set(["the","a","an","and","or","but","to","of","in","on","at","is","are","was","were","i","you","we","they","he","she","it","its","my","your","our","their","for","with","so","do","did","does","can","will","be","not","no","too","this","that","these","those","me","him","her","them","us"]);

function flatItems() {
  let n = 0;
  const out = [];
  DATA[cur.lesson][cur.part].forEach((sec, si) => {
    sec.items.forEach((it, ii) => { out.push({ n: ++n, si, ii, tag: it[0], en: it[1], ko: it[2] }); });
  });
  return out;
}

// 빈칸 뽑기: 내용어 위주 랜덤 선택
function pickBlanks(en) {
  const toks = en.split(" ");
  const idxs = toks.map((t, i) => ({ i, core: t.replace(/^[^A-Za-z']+|[^A-Za-z']+$/g, "") }))
    .filter(o => /^[A-Za-z']{3,}$/.test(o.core) && !STOP.has(o.core.toLowerCase()))
    .map(o => o.i);
  const count = Math.min(3, Math.max(1, Math.floor(idxs.length / 3)));
  for (let i = idxs.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [idxs[i], idxs[j]] = [idxs[j], idxs[i]]; }
  return idxs.slice(0, count).sort((a, b) => a - b);
}

function ensureBlanks() {
  const s = st();
  flatItems().forEach(f => { if (!s.blanks[f.n]) s.blanks[f.n] = pickBlanks(f.en); });
}

function render() {
  document.getElementById("lessonTabs").innerHTML = ["5", "6"].map(l =>
    '<button class="' + (cur.lesson === l ? "on" : "") + '" onclick="setView(\'' + l + '\',null,null)">Lesson ' + l + "</button>").join("");
  document.getElementById("partRow").innerHTML = PARTS.filter(p => DATA[cur.lesson][p[0]]).map(p =>
    '<button class="' + (cur.part === p[0] ? "on" : "") + '" onclick="setView(null,\'' + p[0] + '\',null)">' + p[1] + "</button>").join("");
  document.getElementById("modeSeg").innerHTML = MODES.map(m =>
    '<button class="' + (cur.mode === m[0] ? "on" : "") + '" onclick="setView(null,null,\'' + m[0] + '\')">' + m[1] + "</button>").join("");
  document.getElementById("shuffleBtn").style.display = cur.mode === "blank" ? "" : "none";
  document.getElementById("hintBtn").style.display = cur.mode === "blank" ? "" : "none";
  document.getElementById("hintBtn").classList.toggle("hinton", st().hint);

  if (cur.mode === "blank") ensureBlanks();
  const s = st();
  const flats = flatItems();
  const bySec = {};
  flats.forEach(f => (bySec[f.si] = bySec[f.si] || []).push(f));

  const content = document.getElementById("content");
  content.innerHTML = DATA[cur.lesson][cur.part].map((sec, si) => {
    const items = bySec[si] || [];
    const r0 = String(items[0].n).padStart(2, "0"), r1 = String(items[items.length - 1].n).padStart(2, "0");
    return '<div class="section"><div class="sechead"><span class="range">' + r0 + "–" + r1 + '</span><span class="st">' + esc(sec.t) + '</span><span class="ss">' + esc(sec.s) + "</span></div>" +
      items.map(f => renderItem(f, s)).join("") + "</div>";
  }).join("");
  updateFill();
  if (s.graded) applyGrades(false);
  else document.getElementById("statusMsg").textContent = "아직 채점 전";
}

function renderItem(f, s) {
  const tag = f.tag && f.tag !== "★" ? '<span class="sp">' + esc(f.tag) + "</span>" : "";
  const star = f.tag === "★" ? '<span class="sp" title="교과서 강조 문장">★</span>' : "";
  let body;
  if (cur.mode === "write") {
    body = '<div class="top"><span class="no">' + String(f.n).padStart(2, "0") + "</span>" + tag + star +
      '<span class="ko">' + esc(f.ko) + "</span></div>" +
      '<input class="writein" data-n="' + f.n + '" value="' + esc(s.ans[f.n] || "") + '" placeholder="Write the English sentence..." autocomplete="off" spellcheck="false">';
  } else {
    const toks = f.en.split(" ");
    const bl = s.blanks[f.n];
    const parts = toks.map((t, i) => {
      if (!bl.includes(i)) return esc(t);
      const core = t.replace(/^[^A-Za-z']+|[^A-Za-z']+$/g, "");
      const pre = t.slice(0, t.indexOf(core[0]));
      const suf = t.slice(t.indexOf(core) + core.length);
      const val = (s.ans[f.n] || {})[i] || "";
      const ph = s.hint ? core[0] + "…" : "";
      return esc(pre) + '<input class="blank' + (s.hint ? " hint" : "") + '" data-n="' + f.n + '" data-i="' + i +
        '" size="' + Math.max(4, core.length) + '" value="' + esc(val) + '" placeholder="' + ph + '" autocomplete="off" spellcheck="false">' + esc(suf);
    });
    body = '<div class="top"><span class="no">' + String(f.n).padStart(2, "0") + "</span>" + tag + star +
      '<span class="en-line">' + parts.join(" ") + "</span></div>" +
      '<div class="ko" style="margin:6px 0 0 34px; color:var(--muted); font-size:13.5px;">' + esc(f.ko) + "</div>";
  }
  return '<div class="item" data-n="' + f.n + '"><span class="verdict"></span>' + body + '<div class="answer"></div></div>';
}

document.addEventListener("input", e => {
  const s = st();
  if (e.target.classList.contains("writein")) s.ans[e.target.dataset.n] = e.target.value;
  else if (e.target.classList.contains("blank")) {
    const n = e.target.dataset.n;
    s.ans[n] = s.ans[n] || {};
    s.ans[n][e.target.dataset.i] = e.target.value;
  } else return;
  updateFill();
});
document.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const cls = e.target.classList;
  if (!cls.contains("writein") && !cls.contains("blank")) return;
  const all = [...document.querySelectorAll(".writein, .blank")];
  const next = all[all.indexOf(e.target) + 1];
  if (next) { next.focus(); next.scrollIntoView({ block: "center" }); }
});

function updateFill() {
  const flats = flatItems(), s = st();
  let done = 0;
  flats.forEach(f => {
    const a = s.ans[f.n];
    if (cur.mode === "write") { if (a && a.trim()) done++; }
    else if (a && s.blanks[f.n].every(i => (a[i] || "").trim())) done++;
  });
  document.getElementById("fillCount").textContent = "작성 " + done + " / " + flats.length;
}

function setView(l, p, m) {
  if (l) cur.lesson = l;
  if (!DATA[cur.lesson][cur.part]) cur.part = "reading";   // 6과엔 아직 단어 유인물이 없음
  if (p) cur.part = p;
  if (m) cur.mode = m;
  render();
  window.scrollTo({ top: 0 });
}

function resetView() {
  const s = st();
  s.ans = {}; s.graded = null; s.over = {};
  render();
}
function reBlank() {
  const s = st();
  s.blanks = {}; s.ans = {}; s.graded = null; s.over = {};
  render();
}
function toggleHint() {
  const s = st(); s.hint = !s.hint; render();
}

function gradeAll() {
  const s = st();
  s.graded = {};
  flatItems().forEach(f => {
    if (cur.mode === "write") {
      s.graded[f.n] = norm(s.ans[f.n] || "") === norm(f.en);
    } else {
      const toks = f.en.split(" "), a = s.ans[f.n] || {};
      s.graded[f.n] = s.blanks[f.n].every(i => {
        const core = toks[i].replace(/^[^A-Za-z']+|[^A-Za-z']+$/g, "");
        return norm(a[i] || "") === norm(core);
      });
    }
  });
  applyGrades(true);
}

function applyGrades(scroll) {
  const s = st();
  let ok = 0, over = 0, wrong = 0;
  flatItems().forEach(f => {
    const card = document.querySelector('.item[data-n="' + f.n + '"]');
    const v = card.querySelector(".verdict");
    const ansBox = card.querySelector(".answer");
    card.classList.remove("correct", "wrong", "override");
    const pass = s.graded[f.n], od = s.over[f.n];
    if (pass) { ok++; card.classList.add("correct"); v.textContent = "정답"; v.className = "verdict g"; ansBox.innerHTML = ""; card.querySelector(".overbtn")?.remove(); }
    else {
      if (od) { over++; card.classList.add("override"); v.textContent = "선생님 인정"; v.className = "verdict o"; }
      else { wrong++; card.classList.add("wrong"); v.textContent = "오답"; v.className = "verdict b"; }
      ansBox.innerHTML = "정답: <b>" + esc(f.en) + "</b>";
      if (!card.querySelector(".overbtn")) {
        const b = document.createElement("button");
        b.className = "overbtn"; b.onclick = () => { s.over[f.n] = !s.over[f.n]; applyGrades(false); };
        ansBox.after(b);
      }
      const b = card.querySelector(".overbtn");
      b.classList.toggle("on", !!od);
      b.textContent = od ? "✓ 선생님 인정됨 (취소)" : "정답 처리";
    }
  });
  const total = flatItems().length;
  document.getElementById("statusMsg").innerHTML =
    "<b class='g'>" + (ok + over) + "</b> / " + total + " 정답　·　자동 <b class='g'>" + ok + "</b> · 인정 <b class='o'>" + over + "</b> · 오답 <b class='b'>" + wrong + "</b>";
  if (scroll) window.scrollTo({ top: 0, behavior: "smooth" });
}

render();
</script>
